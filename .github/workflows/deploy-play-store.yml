# ============================================================================
# Deploy to Play Store (native Kotlin app)
# ============================================================================
#
# WANN LÄUFT DAS?
#   - NUR MANUELL über GitHub Actions → "Run workflow"
#   - Du wählst per Dropdown: Internal Testing oder Open Beta
#
# WAS PASSIERT? (in dieser Reihenfolge)
#   1. Code auschecken
#   2. Version hochzählen:
#      - Play Console abfragen → höchsten versionCode +1
#      - Internal: optional Semver-Bump
#      - Beta: kein Semver-Bump, aber ebenfalls Play-safe versionCode
#   3. Native Release-AAB bauen (inkl. Unit-Tests) und signieren
#   4. AAB zum Play Store hochladen (NUR gewählter Track)
#   5. Release-Name + Versionshinweise aus dem nativen Changelog
#   6. Version-Bump committen
#   7. Telegram Notification
#
# Hotfixes für die frühere Capacitor-App 4.5.x laufen über die Kopie dieses
# Workflows im Branch legacy/capacitor-4.5.x ("Use workflow from" → Branch).
#
# SECRETS (müssen in GitHub Repo Settings → Secrets gesetzt sein):
#   - KEYSTORE_BASE64        → Base64-encoded Keystore (.jks)
#   - KEYSTORE_PASSWORD      → Keystore Passwort
#   - KEYSTORE_ALIAS         → Key Alias (z.B. "estundnzettl")
#   - PLAY_DEPLOY_KEY_BASE64 → Base64-encoded Google Play Service Account JSON
#
# RELEASE-METADATEN:
#   - Release-Name = "v<versionName> — <erste Zeile der deutschen Versionshinweise>"
#   - Release-Notes werden aus dem nativen In-App-Changelog erzeugt, auf maximal
#     500 Zeichen begrenzt und zusätzlich als Fastlane-Dateien gespeichert.
#   - Override via 'release_notes_override' Input (de-DE) oder RELEASE_NAME/RELEASE_NOTES env.
#
# CROSS-TRACK-SANITY-CHECK:
#   deploy-play.py macht vor + nach dem Upload einen Snapshot aller Tracks
#   und warnt, falls der neue versionCode in unerwarteten Tracks landet
#   (typischerweise ein Hinweis auf Play-Console-seitige Auto-Promotion).
#
# ============================================================================

name: Deploy to Play Store

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store Track'
        required: true
        type: choice
        options:
          - internal
          - beta
      version_bump:
        description: 'Version bump (nur bei Internal, bei Beta ignoriert)'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      release_notes_override:
        description: 'Versionshinweise überschreiben (optional, max 500 Zeichen)'
        required: false
        default: ''

jobs:
  deploy:
    name: "Build & deploy to ${{ github.event.inputs.track == 'beta' && 'Open Beta' || 'Internal Testing' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Code auschecken ───────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Pull latest changes
        id: git_info
        env:
          REF_NAME: ${{ github.ref_name }}
          DEPLOY_TRACK: ${{ github.event.inputs.track }}
        run: |
          git pull origin "$REF_NAME" --ff-only
          SHORT_SHA=$(git rev-parse --short HEAD)
          SUBJECT=$(git log -1 --format='%s')
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          {
            echo "subject<<EOF"
            echo "$SUBJECT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "📌 HEAD ist jetzt: $(git log --oneline -1)"
          echo "📌 Track: $DEPLOY_TRACK"

      # ── 2. Version hochzählen ────────────────────────────────────────
      - name: Read current version
        id: read_version
        run: |
          CODE=$(grep -oP 'versionCode = \K\d+' native/app/build.gradle.kts)
          NAME=$(grep -oP 'versionName = "\K[^"]+' native/app/build.gradle.kts)
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "📌 Lokale Version: $NAME (versionCode $CODE)"

      # Play Console immer abfragen: Google Play verbrennt versionCodes track-übergreifend.
      # Auch Beta muss daher max(lokal, Play) + 1 verwenden.
      - name: Query highest versionCode from Play Console
        id: play_version
        env:
          PLAY_DEPLOY_KEY_BASE64: ${{ secrets.PLAY_DEPLOY_KEY_BASE64 }}
        run: |
          echo "$PLAY_DEPLOY_KEY_BASE64" | base64 -d > /tmp/play-key.json
          pip install google-auth google-api-python-client -q

          HIGHEST=$(python3 << 'PYEOF'
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          creds = service_account.Credentials.from_service_account_file(
              '/tmp/play-key.json',
              scopes=['https://www.googleapis.com/auth/androidpublisher']
          )
          service = build('androidpublisher', 'v3', credentials=creds)
          pkg = 'com.estundnzettl.app'

          edit = service.edits().insert(body={}, packageName=pkg).execute()
          highest = 0
          for track_name in ['internal', 'alpha', 'beta', 'production']:
              try:
                  track = service.edits().tracks().get(
                      packageName=pkg, editId=edit['id'], track=track_name
                  ).execute()
                  for rel in track.get('releases', []):
                      for code in rel.get('versionCodes', []):
                          highest = max(highest, int(code))
              except Exception:
                  pass
          service.edits().delete(packageName=pkg, editId=edit['id']).execute()
          print(highest)
          PYEOF
          )

          echo "highest=$HIGHEST" >> $GITHUB_OUTPUT
          echo "🔍 Höchster versionCode im Play Store: $HIGHEST"

      - name: Prepare release version
        id: bump
        run: |
          TRACK="${{ github.event.inputs.track }}"
          OLD_CODE=${{ steps.read_version.outputs.code }}
          OLD_NAME=${{ steps.read_version.outputs.name }}
          PLAY_HIGHEST="${{ steps.play_version.outputs.highest }}"

          if ! [[ "$PLAY_HIGHEST" =~ ^[0-9]+$ ]]; then
            PLAY_HIGHEST=0
          fi

          if [ "$PLAY_HIGHEST" -gt "$OLD_CODE" ]; then
            BASE_CODE=$PLAY_HIGHEST
            echo "⚠️ Play Store hat höheren versionCode ($PLAY_HIGHEST) als lokal ($OLD_CODE)"
          else
            BASE_CODE=$OLD_CODE
          fi

          NEW_CODE=$((BASE_CODE + 1))
          NEW_NAME="$OLD_NAME"

          if [ "$TRACK" = "internal" ]; then
            BUMP_TYPE=${{ github.event.inputs.version_bump || 'none' }}
          else
            # Beta: kein Semver-Bump, aber Play-safe versionCode via max(lokal, Play) + 1
            BUMP_TYPE=none
          fi

          if [ "$BUMP_TYPE" != "none" ]; then
            IFS='.' read -r major minor patch <<< "$OLD_NAME"
            case "$BUMP_TYPE" in
              major) new_major=$((major + 1)); new_minor=0; new_patch=0 ;;
              minor) new_major=$major; new_minor=$((minor + 1)); new_patch=0 ;;
              patch) new_major=$major; new_minor=$minor; new_patch=$((patch + 1)) ;;
            esac
            NEW_NAME="${new_major}.${new_minor}.${new_patch}"
          fi

          # Versionsdatei der Kotlin-App aktualisieren
          sed -i "s/versionCode = $OLD_CODE/versionCode = $NEW_CODE/" native/app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$NEW_NAME\"/" native/app/build.gradle.kts

          echo "new_code=$NEW_CODE" >> $GITHUB_OUTPUT
          echo "new_name=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "track=$TRACK" >> $GITHUB_OUTPUT
          echo "🔼 Version: $OLD_NAME ($OLD_CODE) → $NEW_NAME ($NEW_CODE) [Track: $TRACK]"

      - name: Prepare Play Store release notes
        run: |
          CODE="${{ steps.bump.outputs.new_code }}"
          NAME="${{ steps.bump.outputs.new_name }}"
          mkdir -p fastlane/metadata/android/de-DE/changelogs fastlane/metadata/android/en-US/changelogs

          make_notes() {
            LOCALE="$1"
            OUT="$2"
            SRC="fastlane/metadata/android/$LOCALE/changelogs/${{ steps.read_version.outputs.code }}.txt"

            python3 scripts/render_release_notes.py \
              --version "$NAME" \
              --language "$LOCALE" \
              --format play \
              --fallback "$SRC" \
              --output "$OUT"
          }

          make_notes de-DE fastlane/metadata/android/de-DE/changelogs/${CODE}.txt
          make_notes en-US fastlane/metadata/android/en-US/changelogs/${CODE}.txt
          echo "📝 Play Store Release-Notes für versionCode $CODE vorbereitet:"
          sed -n '1,20p' fastlane/metadata/android/de-DE/changelogs/${CODE}.txt

      # ── 3. Java Setup + Build ────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Android SDK 37
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"
          fi

      - name: Build release AAB
        working-directory: native
        run: chmod +x gradlew && ./gradlew :core:test :app:testDebugUnitTest :app:bundleRelease --no-daemon

      # ── 4. AAB signieren ─────────────────────────────────────────────
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Sign AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          AAB="native/app/build/outputs/bundle/release/app-release.aab"
          echo "AAB_PATH=$AAB" >> "$GITHUB_ENV"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            "$AAB" \
            "$KEYSTORE_ALIAS"

      # ── 5. Play Store Upload ─────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Google API dependencies
        run: pip install google-auth google-api-python-client

      - name: Decode Play Store service account key
        env:
          PLAY_DEPLOY_KEY_BASE64: ${{ secrets.PLAY_DEPLOY_KEY_BASE64 }}
        run: echo "$PLAY_DEPLOY_KEY_BASE64" | base64 -d > /tmp/play-key.json

      - name: "Upload to Play Console (${{ github.event.inputs.track }})"
        env:
          PLAY_TRACK: ${{ github.event.inputs.track }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes_override }}
          AAB_PATH: ${{ env.AAB_PATH }}
          VERSION_CODE: ${{ steps.bump.outputs.new_code }}
          VERSION_NAME: ${{ steps.bump.outputs.new_name }}
        run: python3 .github/workflows/scripts/deploy-play.py

      # ── 6. Version-Bump committen (nur Internal) ─────────────────────
      - name: Commit release metadata
        if: github.event.inputs.track == 'internal'
        run: |
          NEW_NAME=${{ steps.bump.outputs.new_name }}
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add native/app/build.gradle.kts fastlane/metadata/android/*/changelogs/${{ steps.bump.outputs.new_code }}.txt
          CURRENT_BRANCH="${{ github.ref_name }}"
          if ! git diff --staged --quiet; then
            git commit -m "chore: release metadata for v$NEW_NAME [skip ci]"
            git push origin "$CURRENT_BRANCH"
            echo "✅ Release-Metadaten für v$NEW_NAME committed (Branch: $CURRENT_BRANCH)"
          else
            echo "ℹ️ Keine Änderungen zu committen"
          fi

      - name: Commit versionCode bump (Beta only)
        if: github.event.inputs.track == 'beta'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add native/app/build.gradle.kts fastlane/metadata/android/*/changelogs/${{ steps.bump.outputs.new_code }}.txt
          if ! git diff --staged --quiet; then
            git commit -m "chore: bump versionCode for Beta v${{ steps.bump.outputs.new_name }} (${{ steps.bump.outputs.new_code }}) [skip ci]"
            git push origin "${{ github.ref_name }}"
            echo "✅ versionCode-Bump committed"
          else
            echo "ℹ️ Keine Änderungen"
          fi

      # ── 7. Deploy-Verifizierung (nur Internal) ──────────────────────
      - name: Verify Play Store deployment
        if: github.event.inputs.track == 'internal'
        env:
          PLAY_DEPLOY_KEY_BASE64: ${{ secrets.PLAY_DEPLOY_KEY_BASE64 }}
        run: |
          echo "$PLAY_DEPLOY_KEY_BASE64" | base64 -d > /tmp/play-key.json
          pip install google-auth google-api-python-client -q

          python3 << 'PYEOF'
          import json, time, sys
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          creds = service_account.Credentials.from_service_account_file(
              '/tmp/play-key.json',
              scopes=['https://www.googleapis.com/auth/androidpublisher']
          )
          service = build('androidpublisher', 'v3', credentials=creds)
          pkg = 'com.estundnzettl.app'

          for attempt in range(10):
              try:
                  edit = service.edits().insert(body={}, packageName=pkg).execute()
                  track = service.edits().tracks().get(
                      packageName=pkg, editId=edit['id'], track='internal'
                  ).execute()
                  service.edits().delete(packageName=pkg, editId=edit['id']).execute()

                  releases = track.get('releases', [])
                  for rel in releases:
                      codes = [int(c) for c in rel.get('versionCodes', [])]
                      target = int('${{ steps.bump.outputs.new_code }}')
                      if target in codes and rel.get('status') == 'completed':
                          print(f"✅ versionCode {target} ist im Internal Testing Track!")
                          sys.exit(0)
              except Exception as e:
                  print(f"⚠️ Versuch {attempt+1}: {e}")

              print(f"⏳ Versuch {attempt+1}/10 — warte 30s...")
              time.sleep(30)

          print("❌ Version nach 5 Minuten nicht im Track gefunden!")
          sys.exit(1)
          PYEOF

      # ── 8. Telegram Notification ────────────────────────────────────
      - name: Telegram notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_TRACK: ${{ github.event.inputs.track }}
          JOB_STATUS: ${{ job.status }}
          VERSION_NAME: ${{ steps.bump.outputs.new_name || 'unbekannt' }}
          VERSION_CODE: ${{ steps.bump.outputs.new_code || 'unbekannt' }}
          COMMIT_SHA: ${{ steps.git_info.outputs.short_sha || 'unbekannt' }}
          COMMIT_SUBJECT: ${{ steps.git_info.outputs.subject || '' }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TRACK="$DEPLOY_TRACK"
          TRACK_LABEL=$( [ "$TRACK" = "beta" ] && echo "Open Beta" || echo "Internal Testing" )

          if [ "$JOB_STATUS" = "success" ]; then
            printf -v MSG '✅ *eStundnzettl Deploy erfolgreich*\n\nVersion: v%s (Code %s)\nCommit: `%s` — %s\nTrack: %s\nStatus: Hochgeladen' \
              "$VERSION_NAME" "$VERSION_CODE" "$COMMIT_SHA" "$COMMIT_SUBJECT" "$TRACK_LABEL"
            if [ "$TRACK" = "beta" ]; then
              MSG="${MSG}"$'\n\n⏳ Beta-Tester bekommen das Update in ca. 1-3h.'
            else
              MSG="${MSG}"$' und verifiziert\n\n⏳ Download in ca. 10-30 Min im Play Store verfügbar.'
            fi
          else
            printf -v MSG '❌ *eStundnzettl Deploy fehlgeschlagen*\n\nVersion: v%s\nTrack: %s\nCommit: `%s`\nWorkflow: %s' \
              "$VERSION_NAME" "$TRACK_LABEL" "$COMMIT_SHA" "$WORKFLOW_URL"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown"
