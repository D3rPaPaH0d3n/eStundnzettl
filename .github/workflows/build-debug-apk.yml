# ============================================================================
# Legacy Capacitor Debug APK — Platzhalter auf main
# ============================================================================
#
# GitHub zeigt "Run workflow" nur für Workflows, deren Datei auch auf dem
# Default-Branch liegt. Diese Datei hält den Button für den Legacy-Build
# sichtbar; der eigentliche Build steht in der gleichnamigen Datei im Branch
# legacy/capacitor-4.5.x. Für einen 4.5.x-Hotfix dort starten:
# "Use workflow from" → legacy/capacitor-4.5.x.
#
# Auf main selbst gibt es nichts zu bauen — der Job wird übersprungen.
#
# ============================================================================

name: Legacy Capacitor Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    if: github.ref == 'refs/heads/legacy/capacitor-4.5.x'
    name: "Build Legacy Capacitor APK (${{ github.ref_name }})"
    runs-on: ubuntu-latest
    steps:
      - name: Use the legacy branch's workflow
        run: echo "Start this workflow from branch legacy/capacitor-4.5.x."
