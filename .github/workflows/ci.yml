# ============================================================================
# Continuous Integration
# ============================================================================
#
# Läuft auf Push nach main und für alle Pull Requests.
# Die native Kotlin-App ist das Hauptprodukt. Die frühere Web-App bleibt
# vorübergehend als Migrationsreferenz im Repository und wird separat geprüft.
#
# Greift NICHT auf Secrets zu und baut keine signierte Release-APK; ist daher safe für PRs
# aus Forks.
#
# ============================================================================

name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Vorhandene Runs für denselben Ref abbrechen, sobald ein neuer kommt.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Kotlin tests & Android build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x native/gradlew

      - name: Test and build native Android app
        working-directory: native
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug --no-daemon

  legacy-compatibility:
    name: Legacy migration compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
