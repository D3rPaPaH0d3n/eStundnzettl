# ============================================================================
# Build Debug APK
# ============================================================================
#
# Baut eine Debug-APK und stellt sie als Download bereit.
# Wird manuell über GitHub Actions → "Run workflow" gestartet.
#
# Branch-Auswahl über den "Use workflow from" Dropdown oben.
# Die Debug-Konfiguration (parallele Installation, Badge, App-Name)
# wird automatisch zur Build-Zeit injiziert.
#
# Kein Keystore oder Play Store Zugang nötig — nur Debug-Signatur.
# APK wird mit Commit-Hash benannt für eindeutige Identifizierung.
#
# ============================================================================

name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    name: "Build Debug APK (${{ github.ref_name }})"
    runs-on: ubuntu-latest

    steps:
      # ── 1. Code auschecken (vom gewählten Branch) ────────────────────
      - name: Checkout
        uses: actions/checkout@v7

      # ── 1.5 Build-Kennung generieren ─────────────────────────────────
      - name: Generate build ID
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date +%Y%m%d-%H%M)
          BUILD_ID="${BUILD_TIME}-${SHORT_SHA}"
          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "📌 Build: $BUILD_ID (Branch: ${{ github.ref_name }})"

      # ── 1.6 Debug-Konfiguration injizieren ───────────────────────────
      # Stellt sicher, dass JEDER Branch mit Debug-Badge + paralleler
      # Installation gebaut wird, auch wenn der Branch diese Änderungen
      # noch nicht hat.
      - name: Inject debug configuration
        run: |
          # applicationIdSuffix für parallele Installation
          if ! grep -q 'applicationIdSuffix ".debug"' android/app/build.gradle; then
            sed -i 's/buildTypes {/buildTypes {\n        debug {\n            applicationIdSuffix ".debug"\n        }/' android/app/build.gradle
            echo "✅ applicationIdSuffix '.debug' injected"
          else
            echo "ℹ️ applicationIdSuffix already present"
          fi

          # Debug-Ressourcen (App-Name, Icon-Badge)
          mkdir -p android/app/src/debug/res/values
          mkdir -p android/app/src/debug/res/drawable
          mkdir -p android/app/src/debug/res/mipmap-anydpi-v26

          cat > android/app/src/debug/res/values/strings.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">eStundnzettl DEV</string>
              <string name="title_activity_main">eStundnzettl DEV</string>
          </resources>
          XMLEOF

          cat > android/app/src/debug/res/values/ic_launcher_background.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#FF6D00</color>
          </resources>
          XMLEOF

          cat > android/app/src/debug/res/drawable/debug_badge_banner.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#D32F2F"
                  android:pathData="M0,90 L108,90 L108,108 L0,108 Z" />
          </vector>
          XMLEOF

          cat > android/app/src/debug/res/drawable/ic_launcher_foreground_debug.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@mipmap/ic_launcher_foreground" />
              <item android:drawable="@drawable/debug_badge_banner" />
          </layer-list>
          XMLEOF

          cat > android/app/src/debug/res/mipmap-anydpi-v26/ic_launcher.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground_debug" />
          </adaptive-icon>
          XMLEOF

          cat > android/app/src/debug/res/mipmap-anydpi-v26/ic_launcher_round.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground_debug" />
          </adaptive-icon>
          XMLEOF

          echo "✅ Debug resources injected"

      # ── 2. Node.js Setup + Dependencies ──────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── 3. Tests ────────────────────────────────────────────────────
      - name: Run unit tests
        run: npm test

      # ── 4. Frontend bauen ────────────────────────────────────────────
      - name: Build frontend
        run: npm run build

      # ── 5. Capacitor Sync ────────────────────────────────────────────
      - name: Sync Capacitor
        run: npx cap sync android

      # ── 6. Proguard Fix (nach cap sync!) ─────────────────────────────
      - name: Fix Proguard config
        run: |
          find node_modules/@capacitor -name "build.gradle" -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} \;
          find node_modules/@capgo -name "build.gradle" -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} \; 2>/dev/null || true
          find node_modules/@capacitor-community -name "build.gradle" -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} \; 2>/dev/null || true

      # ── 7. Java Setup ────────────────────────────────────────────────
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ── 8. Debug APK bauen ───────────────────────────────────────────
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # ── 8.5 APK umbenennen mit Build-ID ──────────────────────────────
      - name: Rename APK with build ID
        run: |
          APK=$(find android/app/build/outputs -name "*.apk" -type f | head -1)
          if [ -n "$APK" ]; then
            DIR=$(dirname "$APK")
            mv "$APK" "$DIR/eStundnzettl-DEV-${BUILD_ID}.apk"
            echo "✅ Renamed to: eStundnzettl-DEV-${BUILD_ID}.apk"
            ls -la "$DIR/"
          else
            echo "❌ No APK found!"
            exit 1
          fi

      # ── 9. APK als Artifact hochladen ────────────────────────────────
      - name: Upload Debug APK
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: eStundnzettl-DEV-${{ env.BUILD_ID }}
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error

      # ── 10. Telegram Notification ────────────────────────────────────
      - name: Telegram notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            DOWNLOAD_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload.outputs.artifact-id }}"
            MSG="📱 *eStundnzettl DEV Build fertig*%0A%0ABuild: \`${BUILD_ID}\`%0ABranch: ${{ github.ref_name }}%0A%0A⬇️ [APK herunterladen](${DOWNLOAD_URL})"
          else
            MSG="❌ *eStundnzettl DEV Build fehlgeschlagen*%0A%0ABranch: ${{ github.ref_name }}%0AWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown"
