name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fix Capacitor proguard reference (Gradle 9 compat)
        run: |
          find node_modules/@capacitor -name "build.gradle" \
            -exec sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" {} \;

      - name: Build web assets (Vite)
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eStundnzettl-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload APK to Nextcloud
        run: |
          APK=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -1)
          FILENAME=$(basename "$APK")
          curl -s -u "${{ secrets.NEXTCLOUD_USER }}:${{ secrets.NEXTCLOUD_PASS }}" \
            -T "$APK" \
            "${{ secrets.NEXTCLOUD_URL }}${FILENAME}"
          echo "✅ APK hochgeladen: ${FILENAME}"
