# ============================================================================
# Deploy to Play Store (Open Beta Testing)
# ============================================================================
#
# WANN LÄUFT DAS?
#   - NUR MANUELL über GitHub Actions → "Run workflow"
#   - Kein automatischer Trigger bei Push auf main
#
# WAS IST DER UNTERSCHIED ZUM INTERNAL-WORKFLOW?
#   - Uploadet zum "beta" Track (Open Testing) statt "internal"
#   - Macht KEINEN Version-Bump und KEINEN Commit — nutzt die aktuelle Version
#     aus package.json + build.gradle (idealerweise vorher via Internal getestet)
#   - Kein Changelog-Generator, keine Git-Schreibzugriffe
#
# VORGEHENSWEISE:
#   1. Feature via normalem Deploy in Internal Testing releasen
#   2. Wenn stabil: diesen Workflow manuell starten → gleiche versionCode
#      wandert in den Open Beta Track
#   3. Open Beta Tester bekommen Update im Play Store
#
# SECRETS (gleich wie Internal Workflow):
#   - KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEYSTORE_ALIAS
#   - PLAY_DEPLOY_KEY_BASE64
#
# HINWEIS ZUM VERSIONCODE:
#   Der Play Store erlaubt einen versionCode nur einmal pro App. Wenn du
#   die gleiche Version erneut in Beta hochlädst wie in Internal, musst du
#   den versionCode +1 erhöhen. Daher: Dieser Workflow zählt versionCode
#   in build.gradle +1 hoch (ohne Commit, lokal im Runner).
#
# ============================================================================

name: Deploy to Play Store (Open Beta)

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release-Name für den Beta-Track (optional)'
        required: false
        default: ''

jobs:
  deploy-beta:
    name: Build, Sign & Deploy to Open Beta Testing
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Code auschecken ───────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest changes
        id: git_info
        run: |
          git pull origin "${{ github.ref_name }}" --ff-only
          SHORT_SHA=$(git rev-parse --short HEAD)
          SUBJECT=$(git log -1 --format='%s')
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "subject=$SUBJECT" >> $GITHUB_OUTPUT
          echo "📌 HEAD ist jetzt: $(git log --oneline -1)"

      # ── 2. Node.js Setup + Dependencies ──────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # ── 3. versionCode für Beta-Track hochzählen ─────────────────────
      # versionName bleibt unverändert — die Beta nutzt die gleiche Version
      # wie Internal Testing. Nur der versionCode muss +1 (Play Store Pflicht).
      - name: Bump versionCode only
        id: bump
        run: |
          OLD_CODE=$(grep -oP 'versionCode\s+\K\d+' android/app/build.gradle)
          NEW_CODE=$((OLD_CODE + 1))
          NAME=$(node -p "require('./package.json').version")

          sed -i "s/versionCode $OLD_CODE/versionCode $NEW_CODE/" android/app/build.gradle

          echo "new_code=$NEW_CODE" >> $GITHUB_OUTPUT
          echo "new_name=$NAME" >> $GITHUB_OUTPUT
          echo "🔼 VersionCode: $OLD_CODE → $NEW_CODE | VersionName: $NAME (unverändert)"

      # ── 4. Frontend bauen ────────────────────────────────────────────
      - name: Build web assets
        run: npm run build

      # ── 5. Capacitor Sync ────────────────────────────────────────────
      - name: Sync Capacitor
        run: npx cap sync android

      # ── 6. Proguard-Fix ──────────────────────────────────────────────
      - name: Fix Capacitor Proguard reference
        run: |
          find node_modules/@capacitor -name "build.gradle" \
            -exec sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" {} \;

      # ── 7. Java Setup ────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 8. Release AAB bauen ─────────────────────────────────────────
      - name: Build release AAB
        run: cd android && ./gradlew bundleRelease --no-daemon

      # ── 9. AAB signieren ─────────────────────────────────────────────
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Sign AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$KEYSTORE_ALIAS"

      # ── 10. Play Store Upload (Open Beta Track) ──────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google API dependencies
        run: pip install google-auth google-api-python-client

      - name: Decode Play Store service account key
        env:
          PLAY_DEPLOY_KEY_BASE64: ${{ secrets.PLAY_DEPLOY_KEY_BASE64 }}
        run: echo "$PLAY_DEPLOY_KEY_BASE64" | base64 -d > /tmp/play-key.json

      - name: Upload to Play Console (Open Beta Testing)
        env:
          PLAY_TRACK: beta
        run: python3 .github/workflows/scripts/deploy-play.py

      # ── 11. versionCode-Bump committen (ohne Changelog) ──────────────
      # [skip ci] verhindert, dass der Internal-Workflow nochmal triggert.
      - name: Commit versionCode bump
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add android/app/build.gradle
          if ! git diff --staged --quiet; then
            git commit -m "chore: bump versionCode for Beta v${{ steps.bump.outputs.new_name }} (${{ steps.bump.outputs.new_code }}) [skip ci]"
            git push origin main
            echo "✅ versionCode-Bump committed und gepusht"
          else
            echo "ℹ️ Keine Änderungen"
          fi

      # ── 12. Telegram Notification ────────────────────────────────────
      - name: Telegram notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MSG="🧪 *eStundnzettl Beta Deploy erfolgreich*%0A%0AVersion: v${{ steps.bump.outputs.new_name }} (Code ${{ steps.bump.outputs.new_code }})%0ACommit: \`${{ steps.git_info.outputs.short_sha }}\` — ${{ steps.git_info.outputs.subject }}%0ATrack: Open Beta Testing%0A%0A⏳ Beta-Tester bekommen das Update in ca. 1-3h."
          else
            MSG="❌ *eStundnzettl Beta Deploy fehlgeschlagen*%0A%0ACommit: \`${{ steps.git_info.outputs.short_sha || 'unbekannt' }}\`%0AWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown"
