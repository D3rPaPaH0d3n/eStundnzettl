# Keep dependency maintenance inside GitHub instead of an external quality dashboard.
# Dependabot opens pull requests; CI decides whether updates are safe.
#
# Monatlicher Rhythmus mit genau einem Sammel-PR pro Ökosystem.
# Die eingefrorene Legacy-App (npm im Repo-Root, Gradle unter /android)
# wird nicht mehr von Dependabot angefasst.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:15"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 3
    groups:
      actions-all:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/native"
    schedule:
      interval: "monthly"
      time: "06:30"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 3
    groups:
      gradle-all:
        patterns:
          - "*"
