# ============================================================================
# Continuous Integration
# ============================================================================
#
# Läuft auf Push und Pull Request für alle Branches.
# Prüft: Lint, Typecheck, Tests, Web-Build und Android-Debug-Build — alles
# auf Node 22 (wie die anderen Workflows).
#
# Greift NICHT auf Secrets zu und baut keine signierte Release-APK; ist daher safe für PRs
# aus Forks.
#
# ============================================================================

name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:

# Vorhandene Runs für denselben Ref abbrechen, sobald ein neuer kommt.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Android debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
