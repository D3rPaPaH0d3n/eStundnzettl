# ============================================================================
# Deploy to Play Store (Internal Testing)
# ============================================================================
#
# WANN LÄUFT DAS?
#   - Bei jedem Push auf "main" (außer der Commit enthält [skip ci])
#   - Oder manuell über GitHub Actions → "Run workflow"
#
# WAS PASSIERT? (in dieser Reihenfolge)
#   1. Code auschecken
#   2. Node.js + Dependencies installieren
#   3. Version hochzählen (VOR dem Build! → Vite liest aus package.json)
#   4. Frontend bauen (Vite — injiziert Version via __APP_VERSION__)
#   5. Capacitor Sync (Web Assets → Android Projekt kopieren)
#   6. Capacitor Proguard-Bug fixen (MUSS nach cap sync sein!)
#   7. Java Setup
#   8. Release AAB bauen (./gradlew bundleRelease)
#   9. AAB signieren (jarsigner mit Keystore)
#  10. AAB zum Play Store hochladen (Internal Testing Track)
#  11. Changelog aus Commits generieren
#  12. Version-Bump + Changelog committen & pushen mit [skip ci]
#
# SECRETS (müssen in GitHub Repo Settings → Secrets gesetzt sein):
#   - KEYSTORE_BASE64        → Base64-encoded Keystore (.jks)
#   - KEYSTORE_PASSWORD      → Keystore Passwort
#   - KEYSTORE_ALIAS         → Key Alias (z.B. "estundnzettl")
#   - PLAY_DEPLOY_KEY_BASE64 → Base64-encoded Google Play Service Account JSON
#
# WICHTIG:
#   - Der Version-Bump Commit enthält [skip ci] → verhindert Endlosschleife
#   - Proguard-Fix MUSS nach "cap sync" kommen, weil cap sync die
#     node_modules/@capacitor Files ins Android-Projekt kopiert
#   - Der Workflow baut KEIN Debug APK — nur die Release AAB für den Play Store
#
# ============================================================================

name: Deploy to Play Store (Internal Testing)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type (nur manuell)'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - patch
          - minor
          - major

jobs:
  deploy:
    name: Build, Sign & Deploy to Internal Testing
    runs-on: ubuntu-latest
    # Nicht laufen wenn der Commit [skip ci] enthält (= unser eigener Version-Bump)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write

    steps:
      # ── 1. Code auschecken ───────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Brauchen wir für git log (Changelog) und Tags

      # ── 2. Node.js Setup + Dependencies ──────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── 3. Version hochzählen (VOR dem Build!) ──────────────────────
      # versionCode: Ganzzahl, wird um +1 erhöht (Play Store braucht immer höher)
      # versionName: Semver String (z.B. "6.3.21" → "6.3.22")
      # package.json ist Single Point of Truth — Vite liest die Version daraus
      - name: Read current version
        id: read_version
        run: |
          CODE=$(grep -oP 'versionCode\s+\K\d+' android/app/build.gradle)
          NAME=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "📌 Aktuelle Version: $NAME (versionCode $CODE)"

      - name: Bump version
        id: bump
        run: |
          BUMP_TYPE=${{ github.event.inputs.version_bump || 'patch' }}
          OLD_CODE=${{ steps.read_version.outputs.code }}
          OLD_NAME=${{ steps.read_version.outputs.name }}

          # versionCode +1
          NEW_CODE=$((OLD_CODE + 1))
          sed -i "s/versionCode $OLD_CODE/versionCode $NEW_CODE/" android/app/build.gradle

          # versionName bumpen (Semver)
          IFS='.' read -r major minor patch <<< "$OLD_NAME"
          case "$BUMP_TYPE" in
            major) new_major=$((major + 1)); new_minor=0; new_patch=0 ;;
            minor) new_major=$major; new_minor=$((minor + 1)); new_patch=0 ;;
            patch) new_major=$major; new_minor=$minor; new_patch=$((patch + 1)) ;;
          esac
          NEW_NAME="${new_major}.${new_minor}.${new_patch}"

          # In build.gradle + package.json aktualisieren (constants.js nicht mehr nötig!)
          sed -i "s/versionName \"[^\"]*\"/versionName \"$NEW_NAME\"/" android/app/build.gradle
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$NEW_NAME';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          echo "new_code=$NEW_CODE" >> $GITHUB_OUTPUT
          echo "new_name=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "🔼 Version: $OLD_NAME ($OLD_CODE) → $NEW_NAME ($NEW_CODE)"

      # ── 4. Frontend bauen (Vite) ─────────────────────────────────────
      # Vite liest die Version aus package.json via __APP_VERSION__ define
      - name: Build web assets
        run: npm run build

      # ── 5. Capacitor Sync ────────────────────────────────────────────
      # Kopiert die gebauten Web Assets ins Android-Projekt
      - name: Sync Capacitor
        run: npx cap sync android

      # ── 6. Proguard-Fix (Capacitor Bug) ──────────────────────────────
      # WICHTIG: Muss NACH cap sync kommen!
      - name: Fix Capacitor Proguard reference
        run: |
          find node_modules/@capacitor -name "build.gradle" \
            -exec sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" {} \;

      # ── 7. Java Setup ────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 8. Release AAB bauen ─────────────────────────────────────────
      - name: Build release AAB
        run: cd android && ./gradlew bundleRelease --no-daemon

      # ── 9. AAB signieren ─────────────────────────────────────────────
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Sign AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$KEYSTORE_ALIAS"

      # ── 10. Play Store Upload ────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google API dependencies
        run: pip install google-auth google-api-python-client

      - name: Decode Play Store service account key
        env:
          PLAY_DEPLOY_KEY_BASE64: ${{ secrets.PLAY_DEPLOY_KEY_BASE64 }}
        run: echo "$PLAY_DEPLOY_KEY_BASE64" | base64 -d > /tmp/play-key.json

      - name: Upload to Play Console (Internal Testing)
        run: python3 .github/workflows/scripts/deploy-play.py

      # ── 11. Changelog generieren ─────────────────────────────────────
      - name: Generate changelog
        run: python3 .github/workflows/scripts/generate-changelog.py

      # ── 12. Version-Bump + Changelog committen ───────────────────────
      # WICHTIG: [skip ci] im Commit verhindert, dass dieser Push
      # den Workflow nochmal auslöst → keine Endlosschleife!
      - name: Commit and push release metadata
        run: |
          NEW_NAME=${{ steps.bump.outputs.new_name }}

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Alle Version-Dateien stagen (constants.js nicht mehr nötig — liest aus Build)
          git add android/app/build.gradle package.json

          # Changelog stagen (falls aktualisiert)
          git diff --name-only | grep -q "changelog-data.js" && \
            git add src/data/changelog-data.js || true

          # Nur committen wenn es Änderungen gibt
          if ! git diff --staged --quiet; then
            git commit -m "chore: release metadata for v$NEW_NAME [skip ci]"
            git push origin main
            echo "✅ Release-Metadaten für v$NEW_NAME committed und gepusht"
          else
            echo "ℹ️ Keine Änderungen zu committen"
          fi

      # ── 13. Deploy-Verifizierung ─────────────────────────────────────
      # Prüft ob die neue versionCode wirklich im Internal Testing Track ist
      - name: Verify Play Store deployment
        env:
          PLAY_DEPLOY_KEY_BASE64: ${{ secrets.PLAY_DEPLOY_KEY_BASE64 }}
        run: |
          echo "$PLAY_DEPLOY_KEY_BASE64" | base64 -d > /tmp/play-key.json
          pip install google-auth google-api-python-client -q

          python3 << 'PYEOF'
          import json, time, sys
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          creds = service_account.Credentials.from_service_account_file(
              '/tmp/play-key.json',
              scopes=['https://www.googleapis.com/auth/androidpublisher']
          )
          service = build('androidpublisher', 'v3', credentials=creds)
          pkg = 'com.estundnzettl.app'

          # Maximal 5 Minuten warten
          for attempt in range(10):
              try:
                  edit = service.edits().insert(body={}, packageName=pkg).execute()
                  track = service.edits().tracks().get(
                      packageName=pkg, editId=edit['id'], track='internal'
                  ).execute()
                  service.edits().delete(packageName=pkg, editId=edit['id']).execute()

                  releases = track.get('releases', [])
                  for rel in releases:
                      codes = [int(c) for c in rel.get('versionCodes', [])]
                      target = int('${{ steps.bump.outputs.new_code }}')
                      if target in codes and rel.get('status') == 'completed':
                          print(f"✅ versionCode {target} ist im Internal Testing Track!")
                          sys.exit(0)
              except Exception as e:
                  print(f"⚠️ Versuch {attempt+1}: {e}")

              print(f"⏳ Versuch {attempt+1}/10 — warte 30s...")
              time.sleep(30)

          print("❌ Version nach 5 Minuten nicht im Track gefunden!")
          sys.exit(1)
          PYEOF

      # ── 14. Telegram Notification ────────────────────────────────────
      # Läuft IMMER — auch bei Fehler (if: always())
      - name: Telegram notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ *eStundnzettl Deploy erfolgreich*%0A%0AVersion: v${{ steps.bump.outputs.new_name }} (Code ${{ steps.bump.outputs.new_code }})%0ATrack: Internal Testing%0AStatus: Hochgeladen und verifiziert%0A%0A⏳ Download in ca. 10-30 Min im Play Store verfügbar."
          else
            MSG="❌ *eStundnzettl Deploy fehlgeschlagen*%0A%0AVersion: v${{ steps.bump.outputs.new_name || 'unbekannt' }}%0AWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown"
