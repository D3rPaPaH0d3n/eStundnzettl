# Keep dependency maintenance inside GitHub instead of an external quality dashboard.
# Dependabot opens pull requests; CI decides whether updates are safe.
#
# Monatlicher Rhythmus mit einem Sammel-PR pro Ökosystem (minor + patch).
# Major-Updates kommen weiterhin einzeln, weil sie bewusste Entscheidungen
# brauchen (z. B. AGP- oder Kotlin-Sprünge).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:15"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 3
    groups:
      actions-all:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/native"
    schedule:
      interval: "monthly"
      time: "06:30"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 3
    groups:
      gradle-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
