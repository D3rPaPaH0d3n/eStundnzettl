# ============================================================================
# Deploy to Play Store (Internal Testing ODER Open Beta)
# ============================================================================
#
# WANN LÄUFT DAS?
#   - NUR MANUELL über GitHub Actions → "Run workflow"
#   - Du wählst per Dropdown: Internal Testing oder Open Beta
#
# WAS PASSIERT? (in dieser Reihenfolge)
#   1. Code auschecken
#   2. Node.js + Dependencies installieren
#   3. Tests ausführen
#   4. Version hochzählen:
#      - Internal: Play Console abfragen → höchsten versionCode +1, optional Semver-Bump
#      - Beta: lokales versionCode +1 (kein Commit)
#   5. Frontend bauen (Vite — injiziert Version via __APP_VERSION__)
#   6. Capacitor Sync + Proguard-Fix
#   7. Release AAB bauen + signieren
#   8. AAB zum Play Store hochladen (gewählter Track)
#   9. Release-Name + Versionshinweise aus .github/release-meta.json
#  10. Version-Bump committen (nur Internal)
#  11. Telegram Notification
#
# SECRETS (müssen in GitHub Repo Settings → Secrets gesetzt sein):
#   - KEYSTORE_BASE64        → Base64-encoded Keystore (.jks)
#   - KEYSTORE_PASSWORD      → Keystore Passwort
#   - KEYSTORE_ALIAS         → Key Alias (z.B. "estundnzettl")
#   - PLAY_DEPLOY_KEY_BASE64 → Base64-encoded Google Play Service Account JSON
#
# RELEASE-METADATEN:
#   Release-Name und Versionshinweise werden aus .github/release-meta.json
#   gelesen. Manueller Override via 'release_notes_override' Input möglich.
#   Format: { "releaseName": "v4.1.0 - Titel", "releaseNotes": "..." }
#
# ============================================================================

name: Deploy to Play Store

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store Track'
        required: true
        type: choice
        options:
          - internal
          - beta
      version_bump:
        description: 'Version bump (nur bei Internal, bei Beta ignoriert)'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      release_notes_override:
        description: 'Versionshinweise überschreiben (optional, max 500 Zeichen)'
        required: false
        default: ''

jobs:
  deploy:
    name: "Build & Deploy to ${{ github.event.inputs.track == 'beta' && 'Open Beta' || 'Internal Testing' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Code auschecken ───────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Pull latest changes
        id: git_info
        run: |
          git pull origin "${{ github.ref_name }}" --ff-only
          SHORT_SHA=$(git rev-parse --short HEAD)
          SUBJECT=$(git log -1 --format='%s')
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "subject=$SUBJECT" >> $GITHUB_OUTPUT
          echo "📌 HEAD ist jetzt: $(git log --oneline -1)"
          echo "📌 Track: ${{ github.event.inputs.track }}"

      # ── 2. Node.js Setup + Dependencies ──────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # ── 3. Version hochzählen ────────────────────────────────────────
      - name: Read current version
        id: read_version
        run: |
          CODE=$(grep -oP 'versionCode\s+\K\d+' android/app/build.gradle)
          NAME=$(node -p "require('./package.json').version")
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "📌 Lokale Version: $NAME (versionCode $CODE)"

      # Play Console abfragen (nur bei Internal — bei Beta reicht lokales +1)
      - name: Query highest versionCode from Play Console
        if: github.event.inputs.track == 'internal'
        id: play_version
        env:
          PLAY_DEPLOY_KEY_BASE64: ${{ secrets.PLAY_DEPLOY_KEY_BASE64 }}
        run: |
          echo "$PLAY_DEPLOY_KEY_BASE64" | base64 -d > /tmp/play-key.json
          pip install google-auth google-api-python-client -q

          HIGHEST=$(python3 << 'PYEOF'
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          creds = service_account.Credentials.from_service_account_file(
              '/tmp/play-key.json',
              scopes=['https://www.googleapis.com/auth/androidpublisher']
          )
          service = build('androidpublisher', 'v3', credentials=creds)
          pkg = 'com.estundnzettl.app'

          edit = service.edits().insert(body={}, packageName=pkg).execute()
          highest = 0
          for track_name in ['internal', 'alpha', 'beta', 'production']:
              try:
                  track = service.edits().tracks().get(
                      packageName=pkg, editId=edit['id'], track=track_name
                  ).execute()
                  for rel in track.get('releases', []):
                      for code in rel.get('versionCodes', []):
                          highest = max(highest, int(code))
              except Exception:
                  pass
          service.edits().delete(packageName=pkg, editId=edit['id']).execute()
          print(highest)
          PYEOF
          )

          echo "highest=$HIGHEST" >> $GITHUB_OUTPUT
          echo "🔍 Höchster versionCode im Play Store: $HIGHEST"

      - name: Prepare release version
        id: bump
        run: |
          TRACK="${{ github.event.inputs.track }}"
          OLD_CODE=${{ steps.read_version.outputs.code }}
          OLD_NAME=${{ steps.read_version.outputs.name }}

          if [ "$TRACK" = "internal" ]; then
            # Internal: höchsten versionCode aus Play Console verwenden
            BUMP_TYPE=${{ github.event.inputs.version_bump || 'none' }}
            PLAY_HIGHEST=${{ steps.play_version.outputs.highest || '0' }}

            if [ "$PLAY_HIGHEST" -gt "$OLD_CODE" ]; then
              BASE_CODE=$PLAY_HIGHEST
              echo "⚠️ Play Store hat höheren versionCode ($PLAY_HIGHEST) als lokal ($OLD_CODE)"
            else
              BASE_CODE=$OLD_CODE
            fi

            NEW_CODE=$((BASE_CODE + 1))
            NEW_NAME="$OLD_NAME"

            if [ "$BUMP_TYPE" != "none" ]; then
              IFS='.' read -r major minor patch <<< "$OLD_NAME"
              case "$BUMP_TYPE" in
                major) new_major=$((major + 1)); new_minor=0; new_patch=0 ;;
                minor) new_major=$major; new_minor=$((minor + 1)); new_patch=0 ;;
                patch) new_major=$major; new_minor=$minor; new_patch=$((patch + 1)) ;;
              esac
              NEW_NAME="${new_major}.${new_minor}.${new_patch}"
            fi

            # package.json nur bei echtem Semver-Bump anpassen
            if [ "$BUMP_TYPE" != "none" ]; then
              node -e "
                const fs = require('fs');
                const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                pkg.version = '$NEW_NAME';
                fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\\n');
              "
            fi
          else
            # Beta: einfach lokales +1, kein Semver-Bump
            BUMP_TYPE=none
            NEW_CODE=$((OLD_CODE + 1))
            NEW_NAME="$OLD_NAME"
          fi

          # build.gradle aktualisieren
          sed -i "s/versionCode $OLD_CODE/versionCode $NEW_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$NEW_NAME\"/" android/app/build.gradle

          echo "new_code=$NEW_CODE" >> $GITHUB_OUTPUT
          echo "new_name=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "track=$TRACK" >> $GITHUB_OUTPUT
          echo "🔼 Version: $OLD_NAME ($OLD_CODE) → $NEW_NAME ($NEW_CODE) [Track: $TRACK]"

      # ── 4. Frontend bauen ────────────────────────────────────────────
      - name: Build web assets
        run: npm run build

      # ── 5. Capacitor Sync + Proguard-Fix ─────────────────────────────
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix Capacitor Proguard reference
        run: |
          find node_modules/@capacitor -name "build.gradle" \
            -exec sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" {} \;

      # ── 6. Java Setup + Build ────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release AAB
        run: cd android && ./gradlew bundleRelease --no-daemon

      # ── 7. AAB signieren ─────────────────────────────────────────────
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Sign AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$KEYSTORE_ALIAS"

      # ── 8. Play Store Upload ─────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google API dependencies
        run: pip install google-auth google-api-python-client

      - name: Decode Play Store service account key
        env:
          PLAY_DEPLOY_KEY_BASE64: ${{ secrets.PLAY_DEPLOY_KEY_BASE64 }}
        run: echo "$PLAY_DEPLOY_KEY_BASE64" | base64 -d > /tmp/play-key.json

      - name: "Upload to Play Console (${{ github.event.inputs.track }})"
        env:
          PLAY_TRACK: ${{ github.event.inputs.track }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes_override }}
        run: python3 .github/workflows/scripts/deploy-play.py

      # ── 9. Version-Bump committen (nur Internal) ─────────────────────
      - name: Commit release metadata
        if: github.event.inputs.track == 'internal'
        run: |
          NEW_NAME=${{ steps.bump.outputs.new_name }}
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add android/app/build.gradle package.json
          CURRENT_BRANCH="${{ github.ref_name }}"
          if ! git diff --staged --quiet; then
            git commit -m "chore: release metadata for v$NEW_NAME [skip ci]"
            git push origin "$CURRENT_BRANCH"
            echo "✅ Release-Metadaten für v$NEW_NAME committed (Branch: $CURRENT_BRANCH)"
          else
            echo "ℹ️ Keine Änderungen zu committen"
          fi

      - name: Commit versionCode bump (Beta only)
        if: github.event.inputs.track == 'beta'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add android/app/build.gradle
          if ! git diff --staged --quiet; then
            git commit -m "chore: bump versionCode for Beta v${{ steps.bump.outputs.new_name }} (${{ steps.bump.outputs.new_code }}) [skip ci]"
            git push origin "${{ github.ref_name }}"
            echo "✅ versionCode-Bump committed"
          else
            echo "ℹ️ Keine Änderungen"
          fi

      # ── 10. Deploy-Verifizierung (nur Internal) ──────────────────────
      - name: Verify Play Store deployment
        if: github.event.inputs.track == 'internal'
        env:
          PLAY_DEPLOY_KEY_BASE64: ${{ secrets.PLAY_DEPLOY_KEY_BASE64 }}
        run: |
          echo "$PLAY_DEPLOY_KEY_BASE64" | base64 -d > /tmp/play-key.json
          pip install google-auth google-api-python-client -q

          python3 << 'PYEOF'
          import json, time, sys
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          creds = service_account.Credentials.from_service_account_file(
              '/tmp/play-key.json',
              scopes=['https://www.googleapis.com/auth/androidpublisher']
          )
          service = build('androidpublisher', 'v3', credentials=creds)
          pkg = 'com.estundnzettl.app'

          for attempt in range(10):
              try:
                  edit = service.edits().insert(body={}, packageName=pkg).execute()
                  track = service.edits().tracks().get(
                      packageName=pkg, editId=edit['id'], track='internal'
                  ).execute()
                  service.edits().delete(packageName=pkg, editId=edit['id']).execute()

                  releases = track.get('releases', [])
                  for rel in releases:
                      codes = [int(c) for c in rel.get('versionCodes', [])]
                      target = int('${{ steps.bump.outputs.new_code }}')
                      if target in codes and rel.get('status') == 'completed':
                          print(f"✅ versionCode {target} ist im Internal Testing Track!")
                          sys.exit(0)
              except Exception as e:
                  print(f"⚠️ Versuch {attempt+1}: {e}")

              print(f"⏳ Versuch {attempt+1}/10 — warte 30s...")
              time.sleep(30)

          print("❌ Version nach 5 Minuten nicht im Track gefunden!")
          sys.exit(1)
          PYEOF

      # ── 11. Telegram Notification ────────────────────────────────────
      - name: Telegram notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TRACK="${{ github.event.inputs.track }}"
          TRACK_LABEL=$( [ "$TRACK" = "beta" ] && echo "Open Beta" || echo "Internal Testing" )

          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ *eStundnzettl Deploy erfolgreich*%0A%0AVersion: v${{ steps.bump.outputs.new_name }} (Code ${{ steps.bump.outputs.new_code }})%0ACommit: \`${{ steps.git_info.outputs.short_sha }}\` — ${{ steps.git_info.outputs.subject }}%0ATrack: $TRACK_LABEL%0AStatus: Hochgeladen"
            if [ "$TRACK" = "beta" ]; then
              MSG="${MSG}%0A%0A⏳ Beta-Tester bekommen das Update in ca. 1-3h."
            else
              MSG="${MSG} und verifiziert%0A%0A⏳ Download in ca. 10-30 Min im Play Store verfügbar."
            fi
          else
            MSG="❌ *eStundnzettl Deploy fehlgeschlagen*%0A%0AVersion: v${{ steps.bump.outputs.new_name || 'unbekannt' }}%0ATrack: $TRACK_LABEL%0ACommit: \`${{ steps.git_info.outputs.short_sha || 'unbekannt' }}\`%0AWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown"
