name: Deploy to Play Store (Internal Testing)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      skip_version_bump:
        description: Skip version bump
        required: false
        default: 'false'
        type: boolean

jobs:
  deploy-internal:
    name: Build & Deploy AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Fix Proguard reference
        run: |
          find node_modules/@capacitor -name "build.gradle" \
            -exec sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" {} \;

      - name: Bump versionCode
        if: github.event.inputs.skip_version_bump != 'true'
        run: |
          CURRENT=$(grep -oP 'versionCode\s+\K\d+' android/app/build.gradle)
          NEXT=$((CURRENT + 1))
          sed -i "s/versionCode\s*$CURRENT/versionCode $NEXT/" android/app/build.gradle
          echo "Bumped versionCode: $CURRENT -> $NEXT"

      - name: Show current versionCode
        if: github.event.inputs.skip_version_bump == 'true'
        run: grep -oP 'versionCode\s+\K\d+' android/app/build.gradle

      - name: Build release AAB
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Sign AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$KEYSTORE_ALIAS"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google API deps
        run: pip install google-auth google-api-python-client

      - name: Decode service account key
        env:
          PLAY_DEPLOY_KEY_BASE64: ${{ secrets.PLAY_DEPLOY_KEY_BASE64 }}
        run: |
          echo "$PLAY_DEPLOY_KEY_BASE64" | base64 -d > /tmp/play-key.json

      - name: Deploy to Play Console
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/play-key.json
        run: python3 .github/scripts/deploy-play.py

      - name: Commit version bump
        if: github.event.inputs.skip_version_bump != 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add android/app/build.gradle
          git commit -m "chore: bump versionCode for Play Store deploy" || echo "Nothing to commit"
          git push origin main || echo "Push skipped"
