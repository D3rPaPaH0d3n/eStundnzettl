# ============================================================================
# Coverage Badge
# ============================================================================
#
# Generates a small repo-local SVG badge from the Kover line coverage of the
# pure-Kotlin :core module (calculation, locale/holiday and backup logic).
# No external dashboard, no hard threshold: this is only a calm visibility signal.
#
# ============================================================================

name: Coverage Badge

on:
  push:
    branches: [main]
    paths:
      - "native/core/**"
      - "native/gradle/**"
      - "native/*.kts"
      - "scripts/write_coverage_badge.py"
      - ".github/workflows/coverage-badge.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coverage-badge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-badge:
    name: Update coverage badge
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Without ANDROID_HOME, settings.gradle.kts configures only the pure-JVM
      # :core module — no Android SDK or AGP download needed for coverage.
      - name: Run core tests with coverage
        working-directory: native
        run: |
          chmod +x gradlew
          env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew :core:koverXmlReport --no-daemon

      - name: Generate badge
        run: python3 scripts/write_coverage_badge.py native/core/build/reports/kover/report.xml badges/coverage.svg

      - name: Commit badge if changed
        run: |
          if git diff --quiet -- badges/coverage.svg; then
            echo "Coverage badge unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.svg
          git commit -m "chore: update coverage badge [skip ci]"
          git push
