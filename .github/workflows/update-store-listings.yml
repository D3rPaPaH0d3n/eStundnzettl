# ============================================================================
# Update Play Store Listings
# ============================================================================
#
# WANN LÄUFT DAS?
#   - NUR MANUELL über GitHub Actions → "Run workflow"
#
# WAS PASSIERT?
#   1. Code auschecken
#   2. Service Account JSON aus Secret entschlüsseln
#   3. Ruby + fastlane installieren
#   4. Optional: Dry-Run (validiert Metadaten ohne Upload)
#   5. fastlane supply → Listings für ALLE konfigurierten Sprachen
#      (de-DE, de-AT, de-CH, en-US, …) zum Play Store hochladen
#
# WAS PASSIERT NICHT?
#   - Keine APK/AAB-Builds
#   - Keine Changelog-Updates (die kommen aus deploy-play-store.yml)
#   - Keine Track-Promotions
#   - Keine Versionsbumps
#
# SECRETS:
#   - PLAY_DEPLOY_KEY_BASE64 → Base64-encoded Google Play Service
#                              Account JSON (gleicher Secret wie in
#                              deploy-play-store.yml).
#
# ROLLBACK:
#   Play Console behält Versionshistorie für Listings. Bei einem
#   versehentlichen Upload kann manuell auf eine vorige Version
#   zurückgerollt werden:
#   Play Console → Store presence → Main store listing → Version history
#
# ============================================================================

name: Update Play Store Listings

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur validieren, kein Upload"
        type: boolean
        default: false

# Verhindern, dass parallele Listing-Updates sich überschreiben.
concurrency:
  group: play-store-listings
  cancel-in-progress: false

jobs:
  upload:
    name: "Upload listings (${{ inputs.dry_run && 'DRY-RUN' || 'LIVE' }})"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Decode Play Store service account key
        env:
          PLAY_DEPLOY_KEY_BASE64: ${{ secrets.PLAY_DEPLOY_KEY_BASE64 }}
        run: |
          if [ -z "$PLAY_DEPLOY_KEY_BASE64" ]; then
            echo "::error::PLAY_DEPLOY_KEY_BASE64 secret is not set."
            exit 1
          fi
          echo "$PLAY_DEPLOY_KEY_BASE64" | base64 -d > /tmp/play-key.json
          # Smoke-Test: gültiges JSON?
          jq -r '.client_email' /tmp/play-key.json > /dev/null

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install fastlane
        run: |
          gem install fastlane --no-document
          fastlane --version

      - name: Show metadata snapshot
        run: |
          echo "Locales found:"
          ls -1 fastlane/metadata/android/
          echo ""
          for loc in fastlane/metadata/android/*/; do
            name=$(basename "$loc")
            echo "── $name ──"
            echo "  title:  $(cat "$loc/title.txt" 2>/dev/null | tr -d '\n')"
            echo "  short:  $(cat "$loc/short_description.txt" 2>/dev/null | tr -d '\n')"
          done

      - name: Validate listings (dry run)
        if: ${{ inputs.dry_run }}
        env:
          SUPPLY_JSON_KEY: /tmp/play-key.json
        run: fastlane android validate_listings

      - name: Upload listings
        if: ${{ !inputs.dry_run }}
        env:
          SUPPLY_JSON_KEY: /tmp/play-key.json
        run: fastlane android update_listings

      - name: Cleanup secrets
        if: always()
        run: rm -f /tmp/play-key.json
