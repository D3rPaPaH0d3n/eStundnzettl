# ============================================================================
# Build Debug APK
# ============================================================================
#
# Baut eine Debug-APK und stellt sie als Download bereit.
# Wird manuell über GitHub Actions → "Run workflow" gestartet.
#
# Kein Keystore oder Play Store Zugang nötig — nur Debug-Signatur.
# APK wird mit Commit-Hash benannt für eindeutige Identifizierung.
#
# ============================================================================

name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Code auschecken ───────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1.5 Build-Kennung generieren ─────────────────────────────────
      - name: Generate build ID
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date +%Y%m%d-%H%M)
          BUILD_ID="${BUILD_TIME}-${SHORT_SHA}"
          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "📌 Build: $BUILD_ID"

      # ── 2. Node.js Setup + Dependencies ──────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── 3. Tests ────────────────────────────────────────────────────
      - name: Run unit tests
        run: npm test

      # ── 4. Frontend bauen ────────────────────────────────────────────
      - name: Build frontend
        run: npm run build

      # ── 5. Capacitor Sync ────────────────────────────────────────────
      - name: Sync Capacitor
        run: npx cap sync android

      # ── 6. Proguard Fix (nach cap sync!) ─────────────────────────────
      - name: Fix Proguard config
        run: |
          find node_modules/@capacitor -name "build.gradle" -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} \;
          find node_modules/@capgo -name "build.gradle" -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} \; 2>/dev/null || true
          find node_modules/@capacitor-community -name "build.gradle" -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} \; 2>/dev/null || true

      # ── 7. Java Setup ────────────────────────────────────────────────
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ── 8. Debug APK bauen ───────────────────────────────────────────
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # ── 8.5 APK umbenennen mit Build-ID ──────────────────────────────
      - name: Rename APK with build ID
        run: |
          APK=$(find android/app/build/outputs -name "*.apk" -type f | head -1)
          if [ -n "$APK" ]; then
            DIR=$(dirname "$APK")
            mv "$APK" "$DIR/eStundnzettl-DEV-${BUILD_ID}.apk"
            echo "✅ Renamed to: eStundnzettl-DEV-${BUILD_ID}.apk"
            ls -la "$DIR/"
          else
            echo "❌ No APK found!"
            exit 1
          fi

      # ── 9. APK als Artifact hochladen ────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eStundnzettl-DEV-${{ env.BUILD_ID }}
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error

      # ── 10. Telegram Notification ────────────────────────────────────
      - name: Telegram notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MSG="📱 *eStundnzettl DEV Build fertig*%0A%0ABuild: \`${BUILD_ID}\`%0ABranch: ${{ github.ref_name }}%0A%0A⬇️ [APK herunterladen](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          else
            MSG="❌ *eStundnzettl DEV Build fehlgeschlagen*%0A%0ABranch: ${{ github.ref_name }}%0AWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=Markdown"
