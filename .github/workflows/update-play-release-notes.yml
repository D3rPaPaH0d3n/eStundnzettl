name: Update Play Store release notes

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track containing the existing release"
        required: true
        type: choice
        default: beta
        options:
          - internal
          - beta
          - production
      version_code:
        description: "Existing versionCode (blank = current native versionCode)"
        required: false
        default: ""
      version_name:
        description: "Existing versionName (blank = current native versionName)"
        required: false
        default: ""
      release_name_override:
        description: "Optional Play release name override"
        required: false
        default: ""

jobs:
  update:
    name: Update existing Play release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve target release
        id: target
        env:
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          CODE="$INPUT_VERSION_CODE"
          NAME="$INPUT_VERSION_NAME"
          if [ -z "$CODE" ]; then
            CODE=$(grep -oP 'versionCode = \K\d+' native/app/build.gradle.kts)
          fi
          if [ -z "$NAME" ]; then
            NAME=$(grep -oP 'versionName = "\K[^"]+' native/app/build.gradle.kts)
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Target: ${{ inputs.track }} / v$NAME ($CODE)"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Google Play API client
        run: pip install google-auth google-api-python-client

      - name: Decode Play Store service account key
        env:
          PLAY_DEPLOY_KEY_BASE64: ${{ secrets.PLAY_DEPLOY_KEY_BASE64 }}
        run: echo "$PLAY_DEPLOY_KEY_BASE64" | base64 -d > /tmp/play-key.json

      - name: Update and verify release metadata
        env:
          RELEASE_NAME_OVERRIDE: ${{ inputs.release_name_override }}
        run: |
          python3 .github/workflows/scripts/update-play-release.py \
            --track "${{ inputs.track }}" \
            --version-code "${{ steps.target.outputs.code }}" \
            --version-name "${{ steps.target.outputs.name }}" \
            --release-name "$RELEASE_NAME_OVERRIDE"
