# ============================================================================
# Continuous Integration
# ============================================================================
#
# Läuft auf Push und Pull Request für alle Branches.
# Prüft: Lint, Tests, Build — alles auf Node 22 (wie die anderen Workflows).
#
# Greift NICHT auf Secrets zu und baut keine APK; ist daher safe für PRs
# aus Forks.
#
# ============================================================================

name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:

# Vorhandene Runs für denselben Ref abbrechen, sobald ein neuer kommt.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
