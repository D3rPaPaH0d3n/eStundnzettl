# ============================================================================
# Release to GitHub
# ============================================================================
#
# WANN LÄUFT DAS?
#   - NUR MANUELL über GitHub Actions → "Run workflow"
#
# WAS PASSIERT?
#   1. Code auschecken (auf dem Branch, von dem aus getriggert wird)
#   2. Kotlin-Core- und App-Tests ausführen
#   3. Native Release-APK aus native/ bauen
#   4. APK mit apksigner v2/v3 signieren
#   5. SHA-256 Checksum erzeugen
#   6. Release-Notes aus fastlane/metadata/android/*/changelogs/<code>.txt
#   7. GitHub Release anlegen mit APK + Checksum als Assets
#
# WAS PASSIERT NICHT?
#   - Kein Versionsbump (lokales versionCode/versionName aus build.gradle wird genutzt)
#   - Kein Play-Store-Upload
#   - Kein Commit/Push (lesender Workflow)
#
# WICHTIG — KEYSTORE-IDENTITÄT
#   Wir signieren mit dem GLEICHEN Keystore wie der Play-Store-Workflow.
#   Das ist Absicht: Android erkennt eine App nur dann als "die selbe",
#   wenn die Signatur identisch ist. Würden wir hier einen anderen
#   Keystore nehmen, könnten User nicht von der GitHub-APK auf die
#   Play-Store-Version (oder umgekehrt) updaten ohne Deinstallation.
#
# SECRETS (gleicher Pool wie deploy-play-store.yml):
#   - KEYSTORE_BASE64    → Base64-encoded Keystore (.jks)
#   - KEYSTORE_PASSWORD  → Keystore Passwort
#   - KEYSTORE_ALIAS     → Key Alias (z.B. "estundnzettl")
#
# ============================================================================

name: Release to GitHub

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Release als Entwurf erstellen (nicht öffentlich)"
        type: boolean
        default: true
      prerelease:
        description: "Als Pre-Release markieren"
        type: boolean
        default: false
      release_notes_override:
        description: "Release-Notes überschreiben (optional, sonst aus fastlane changelog)"
        required: false
        default: ""

# Verhindern, dass parallele Releases sich gegenseitig stören.
concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: "Build & publish GitHub Release"
    runs-on: ubuntu-latest
    permissions:
      contents: write # für GitHub Release + Asset-Upload

    steps:
      # ── 1. Code auschecken ───────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Read native app version
        id: version
        run: |
          CODE=$(grep -oP 'versionCode = \K\d+' native/app/build.gradle.kts)
          NAME=$(grep -oP 'versionName = "\K[^"]+' native/app/build.gradle.kts)
          TAG="v${NAME}"
          APK_NAME="eStundnzettl-${TAG}-universal.apk"
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "📌 Version: $NAME (versionCode $CODE) → $TAG"

      - name: Check that tag does not exist yet
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG existiert bereits. Bitte zuerst versionName/versionCode in native/app/build.gradle.kts erhöhen."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::GitHub Release $TAG existiert bereits."
            exit 1
          fi
          echo "✅ Tag $TAG ist noch frei."
        env:
          GH_TOKEN: ${{ github.token }}

      # ── 2. Native Tests + APK bauen ───────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x native/gradlew

      - name: Test and build native release APK
        working-directory: native
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleRelease --no-daemon

      # ── 3. Signieren mit apksigner (v2/v3) ───────────────────────────
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Locate apksigner and zipalign
        id: tools
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "apksigner=$BUILD_TOOLS/apksigner" >> $GITHUB_OUTPUT
          echo "zipalign=$BUILD_TOOLS/zipalign" >> $GITHUB_OUTPUT
          echo "📌 Build-Tools: $BUILD_TOOLS"

      - name: Zipalign and sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          UNSIGNED="native/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="native/app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED="${{ steps.version.outputs.apk_name }}"

          if [ ! -f "$UNSIGNED" ]; then
            # assembleRelease produces app-release.apk if a signing config is present,
            # otherwise app-release-unsigned.apk. Handle both.
            ALT="native/app/build/outputs/apk/release/app-release.apk"
            if [ -f "$ALT" ]; then
              UNSIGNED="$ALT"
            else
              echo "::error::Kein APK-Output gefunden!"
              ls -la native/app/build/outputs/apk/release/
              exit 1
            fi
          fi

          "${{ steps.tools.outputs.zipalign }}" -v -p 4 "$UNSIGNED" "$ALIGNED"
          "${{ steps.tools.outputs.apksigner }}" sign \
            --ks keystore.jks \
            --ks-key-alias "$KEYSTORE_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out "$SIGNED" \
            "$ALIGNED"

          "${{ steps.tools.outputs.apksigner }}" verify --verbose "$SIGNED"
          echo "✅ APK signiert und verifiziert: $SIGNED"

      # ── 4. SHA-256 Checksum ──────────────────────────────────────────
      - name: Generate SHA-256 checksum
        id: checksum
        run: |
          APK="${{ steps.version.outputs.apk_name }}"
          SUM_FILE="${APK}.sha256"
          sha256sum "$APK" > "$SUM_FILE"
          echo "✅ Checksum:"
          cat "$SUM_FILE"
          echo "sum_file=$SUM_FILE" >> $GITHUB_OUTPUT

      # ── 5. Release-Notes zusammenbauen ───────────────────────────────
      # Reihenfolge:
      #   1. Override-Input — wenn gesetzt, gewinnt der.
      #   2. Fastlane-Kurzhinweise passend zum nativen versionCode.
      - name: Build release notes
        id: notes
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_NOTES_OVERRIDE: ${{ github.event.inputs.release_notes_override }}
        run: |
          CODE="$VERSION_CODE"
          NAME="$VERSION_NAME"
          DE_FALLBACK="fastlane/metadata/android/de-DE/changelogs/${CODE}.txt"
          EN_FALLBACK="fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          OVERRIDE="$RELEASE_NOTES_OVERRIDE"

          NOTES_FILE="$(mktemp)"

          if [ -n "$OVERRIDE" ]; then
            printf '%s\n' "$OVERRIDE" > "$NOTES_FILE"
          else
            {
              echo "## eStundnzettl v${NAME} (versionCode ${CODE})"
              echo ""
              echo "### 🇩🇪 Deutsch"
              if [ -f "$DE_FALLBACK" ]; then
                cat "$DE_FALLBACK"
              else
                echo "_Keine deutsche Versionshinweise hinterlegt._"
              fi
              echo ""
              echo "### 🇬🇧 English"
              if [ -f "$EN_FALLBACK" ]; then
                cat "$EN_FALLBACK"
              else
                echo "_No English release notes available._"
              fi
            } > "$NOTES_FILE"
          fi

          {
            echo ""
            echo "---"
            echo ""
            echo "### Installation"
            echo ""
            echo "1. APK herunterladen (\`${{ steps.version.outputs.apk_name }}\`)."
            echo "2. Optional: SHA-256 verifizieren:"
            echo "   \`\`\`"
            echo "   sha256sum -c ${{ steps.version.outputs.apk_name }}.sha256"
            echo "   \`\`\`"
            echo "3. Auf dem Android-Gerät \"Installation aus unbekannten Quellen\" für deinen Browser/Datei-Manager erlauben."
            echo "4. APK öffnen und installieren."
            echo ""
            echo "**Hinweis:** Die GitHub-APK ist mit dem gleichen Keystore signiert wie die Play-Store-Version. Ein Wechsel zwischen den Bezugsquellen (in beide Richtungen) ist ohne Datenverlust möglich."
          } >> "$NOTES_FILE"

          echo "notes_file=$NOTES_FILE" >> $GITHUB_OUTPUT
          echo "── Release Notes ──"
          cat "$NOTES_FILE"
          echo "───────────────────"

      # ── 6. GitHub Release erstellen ──────────────────────────────────
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
          PRE: ${{ inputs.prerelease }}
        run: |
          ARGS=()
          if [ "$DRAFT" = "true" ]; then ARGS+=(--draft); fi
          if [ "$PRE" = "true" ]; then ARGS+=(--prerelease); fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "eStundnzettl ${TAG}" \
            --notes-file "${{ steps.notes.outputs.notes_file }}" \
            "${ARGS[@]}" \
            "${{ steps.version.outputs.apk_name }}" \
            "${{ steps.checksum.outputs.sum_file }}"

          echo "✅ Release ${TAG} erstellt (draft=$DRAFT, prerelease=$PRE)"
          echo ""
          echo "🔗 ${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}"

      # ── 7. Cleanup ───────────────────────────────────────────────────
      - name: Cleanup secrets
        if: always()
        run: rm -f keystore.jks
