# ============================================================================
# Continuous Integration
# ============================================================================
#
# Läuft auf Push nach main und für alle Pull Requests.
# Prüft die native Kotlin-App (Core- und App-Unit-Tests, Debug-Build) sowie
# die Python-Helfer für die Release-Notes.
#
# Greift NICHT auf Secrets zu und baut keine signierte Release-APK; ist daher safe für PRs
# aus Forks.
#
# ============================================================================

name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Vorhandene Runs für denselben Ref abbrechen, sobald ein neuer kommt.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Kotlin tests & Android build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x native/gradlew

      - name: Install Android SDK 37
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"
          fi

      - name: Test release-note rendering
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Test and build native Android app
        working-directory: native
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug --no-daemon
