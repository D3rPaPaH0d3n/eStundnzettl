name: Deploy to Play Store (Internal Testing)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      skip_version_bump:
        description: 'Skip version bump'
        required: false
        default: 'false'
        type: boolean
      version_bump:
        description: 'Version bump type (only used when skip_version_bump is false)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  deploy-internal:
    name: Build & Deploy AAB to Internal Testing
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git log and tags

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Fix Proguard reference
        run: |
          find node_modules/@capacitor -name "build.gradle" \
            -exec sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" {} \;

      - name: Read versions
        id: read_versions
        run: |
          CURRENT_CODE=$(grep -oP 'versionCode\s+\K\d+' android/app/build.gradle)
          CURRENT_NAME=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)
          echo "version_code=$CURRENT_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$CURRENT_NAME" >> $GITHUB_OUTPUT
          echo "Bumping versionName from $CURRENT_NAME"

      - name: Bump versionCode and versionName
        id: bump_version
        if: github.event.inputs.skip_version_bump != 'true'
        run: |
          BUMP_TYPE=${{ github.event.inputs.version_bump || 'patch' }}
          CURRENT_CODE=${{ steps.read_versions.outputs.version_code }}
          CURRENT_NAME=${{ steps.read_versions.outputs.version_name }}

          NEXT_CODE=$((CURRENT_CODE + 1))
          sed -i "s/versionCode $CURRENT_CODE/versionCode $NEXT_CODE/" android/app/build.gradle
          echo "versionCode: $CURRENT_CODE → $NEXT_CODE"

          IFS='.' read -r major minor patch <<< "$CURRENT_NAME"
          echo "Parsed version: $major.$minor.$patch"

          case "$BUMP_TYPE" in
            major)
              new_major=$((major + 1)); new_minor=0; new_patch=0
              ;;
            minor)
              new_major=$major; new_minor=$((minor + 1)); new_patch=0
              ;;
            patch)
              new_major=$major; new_minor=$minor; new_patch=$((patch + 1))
              ;;
          esac

          NEW_NAME="${new_major}.${new_minor}.${new_patch}"
          sed -i "s/versionName \"[^\"]*\"/versionName \"$NEW_NAME\"/" android/app/build.gradle
          echo "versionName: $CURRENT_NAME → $NEW_NAME ($BUMP_TYPE bump)"
          echo "new_version_name=$NEW_NAME" >> $GITHUB_OUTPUT

          sed -i "s/APP_VERSION = \"[^\"]*\"/APP_VERSION = \"v$NEW_NAME\"/" src/hooks/constants.js
          echo "constants.js updated to v$NEW_NAME"

          # Sync package.json (single source of truth for version)
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$NEW_NAME';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('package.json → $NEW_NAME');
          "
          echo "package.json synced to $NEW_NAME"

      - name: Build release AAB
        run: |
          cd android && ./gradlew bundleRelease --no-daemon

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Sign AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$KEYSTORE_ALIAS"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google API deps
        run: pip install google-auth google-api-python-client

      - name: Decode service account key
        env:
          PLAY_DEPLOY_KEY_BASE64: ${{ secrets.PLAY_DEPLOY_KEY_BASE64 }}
        run: echo "$PLAY_DEPLOY_KEY_BASE64" | base64 -d > /tmp/play-key.json

      - name: Deploy to Play Console (Internal Testing)
        working-directory: ${{ github.workspace }}
        run: python3 .github/workflows/scripts/deploy-play.py

      - name: Generate changelog from commits
        id: changelog
        if: github.event.inputs.skip_version_bump != 'true'
        run: |
          python3 .github/workflows/scripts/generate-changelog.py

      - name: Commit version bump and changelog
        if: github.event.inputs.skip_version_bump != 'true'
        run: |
          NEW_NAME=${{ steps.bump_version.outputs.new_version_name }}

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Stage version files (including package.json as source of truth)
          git add android/app/build.gradle src/hooks/constants.js package.json

          # Add changelog if it was updated
          if git diff --name-only | grep -q "changelog-data.js"; then
            git add src/data/changelog-data.js
          fi

          # Only commit if there are staged changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: bump to v$NEW_NAME and update changelog"
            git push origin main && \
              git tag "v$NEW_NAME" -a -m "Version v$NEW_NAME" && \
              git push origin "v$NEW_NAME" || \
              echo "Push or tag blocked (may already exist)"
          fi
