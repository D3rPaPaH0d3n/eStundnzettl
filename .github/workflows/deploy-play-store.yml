name: Deploy to Play Store (Internal Testing)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      skip_version_bump:
        description: 'Skip version bump'
        required: false
        default: 'false'
        type: boolean

jobs:
  deploy-internal:
    name: Build & Deploy AAB to Internal Testing
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Fix Proguard reference
        run: |
          find node_modules/@capacitor -name "build.gradle" \
            -exec sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" {} \;

      - name: Read current versionCode
        id: read_version
        run: |
          CURRENT=$(grep -oP 'versionCode\s+\K\d+' android/app/build.gradle)
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current versionCode: $CURRENT"

      - name: Bump versionCode
        if: github.event.inputs.skip_version_bump != 'true'
        run: |
          NEXT=$(( ${{ steps.read_version.outputs.current }} + 1 ))
          sed -i "s/versionCode\s*${{ steps.read_version.outputs.current }}/versionCode $NEXT/" android/app/build.gradle
          echo "Bumped versionCode: ${{ steps.read_version.outputs.current }} → $NEXT"
          echo "next=$NEXT" >> $GITHUB_OUTPUT

      - name: Show versionCode (no bump mode)
        if: github.event.inputs.skip_version_bump == 'true'
        run: echo "Version bump skipped, using versionCode ${{ steps.read_version.outputs.current }}"

      - name: Build release AAB
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Sign AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$KEYSTORE_ALIAS"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google API deps
        run: pip install google-auth google-api-python-client

      - name: Decode service account key
        env:
          PLAY_DEPLOY_KEY_BASE64: ${{ secrets.PLAY_DEPLOY_KEY_BASE64 }}
        run: |
          echo "$PLAY_DEPLOY_KEY_BASE64" | base64 -d > /tmp/play-key.json

      - name: Deploy to Play Console (Internal Testing)
        run: python3 << 'PYEOF'
import os
from google.auth.transport.requests import Request
from google.oauth2 import service_account
from googleapiclient.discovery import build
from googleapiclient.http import MediaFileUpload
from googleapiclient.errors import HttpError

PACKAGE = "com.estundnzettl.app"
AAB_PATH = "android/app/build/outputs/bundle/release/app-release.aab"

# Get version code from file
with open("android/app/build.gradle") as f:
    import re
    match = re.search(r'versionCode\s+(\d+)', f.read())
    VERSION_CODE = match.group(1) if match else "0"

SCOPES = ["https://www.googleapis.com/auth/androidpublisher"]
creds = service_account.Credentials.from_service_account_file(
    "/tmp/play-key.json", scopes=SCOPES
)
service = build("androidpublisher", "v3", credentials=creds)

# Create edit
edit = service.edits().insert(body={}, packageName=PACKAGE).execute()
edit_id = edit["id"]
print(f"Edit: {edit_id}")

# Upload AAB
media = MediaFileUpload(AAB_PATH, mimetype="application/octet-stream", resumable=True)
bundle = service.edits().bundles().upload(
    packageName=PACKAGE, editId=edit_id, media_body=media
).execute()
vc = bundle["versionCode"]
print(f"Uploaded: versionCode {vc}")

# Get existing internal track releases
try:
    track = service.edits().tracks().get(
        packageName=PACKAGE, editId=edit_id, track="internal"
    ).execute()
    releases = track.get("releases", [])
except HttpError:
    releases = []

# Replace with new release only
new_releases = [{
    "versionCodes": [str(vc)],
    "status": "completed",
    "name": f"v{vc} - GitHub Actions Auto-Deploy"
}]
service.edits().tracks().update(
    packageName=PACKAGE, editId=edit_id, track="internal",
    body={"releases": new_releases}
).execute()

# Commit
commit = service.edits().commit(packageName=PACKAGE, editId=edit_id).execute()
print(f"✅ Deployed versionCode {vc} to Internal Testing!")
PYEOF

      - name: Commit version bump
        if: github.event.inputs.skip_version_bump != 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add android/app/build.gradle
          git commit -m "chore: bump versionCode for Play Store deploy" || echo "Nothing to commit"
          git push origin main || echo "Push blocked (branch protection)"
